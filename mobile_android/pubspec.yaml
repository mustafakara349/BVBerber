name: mobile_android
description: "BVBarber - Berber Randevu Uygulaması"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # İşlevsel
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
