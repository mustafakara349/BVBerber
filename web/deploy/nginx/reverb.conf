# BV Barber — Nginx WebSocket (Reverb) proxy
# Reverb dışarıya açılmaz (127.0.0.1:8080); tarayıcı aynı alan adı + 443 üzerinden /app ve /apps yollarıyla bağlanır.
# Bu blokları mevcut `server { listen 443 ssl; server_name panel.ornek.com; ... }` içine ekleyin.
#
# Canlı .env:
#   BROADCAST_CONNECTION=reverb
#   REVERB_HOST=panel.ornek.com
#   REVERB_PORT=443
#   REVERB_SCHEME=https
#   REVERB_SERVER_HOST=127.0.0.1
#   REVERB_SERVER_PORT=8080
# Ardından: npm run build && php artisan config:cache

location ~ ^/(app|apps)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
