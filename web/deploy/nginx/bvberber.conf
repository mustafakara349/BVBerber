# ==============================================================================
# B&V Barber — Production Nginx Server Block Configuration
# Hardened against SEC-BE-2026-016 (Public Storage Script Execution Prevention)
# ==============================================================================

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name panel.bvberber.com;

    # Allow ACME Let's Encrypt challenges over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/bvberber/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.bvberber.com;

    root /var/www/bvberber/public;
    index index.php index.html;
    charset utf-8;

    # SSL Certificate Configuration (Adjust paths for your environment)
    # ssl_certificate /etc/letsencrypt/live/panel.bvberber.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/panel.bvberber.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Upload Body Size limit matching application max image upload settings (10MB headroom)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/bvberber_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/bvberber_error.log warn;

    # --------------------------------------------------------------------------
    # SEC-BE-2026-016: Storage Script Execution Prevention
    # --------------------------------------------------------------------------
    # The `^~` prefix modifier ensures that if this prefix matches, Nginx
    # completely stops searching for regular expression matches (including the
    # `location ~ \.php$` block below).
    #
    # Uploaded files in `/storage/` are strictly static assets. Any request
    # targeting executable scripts (.php, .phtml, .phar, etc.) in `/storage/`
    # is denied immediately and never passed to PHP-FPM.
    # --------------------------------------------------------------------------
    location ^~ /storage/ {
        # Deny direct access to script interpreters and executable formats
        location ~* \.(php|phtml|phar|pl|py|cgi|sh|bash|exe|bat|cmd)$ {
            deny all;
            return 404;
        }

        # Serve legitimate public static media (images, docs) directly
        try_files $uri =404;

        # Caching & security headers for public static files
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # WebSocket Reverse Proxy for Laravel Reverb
    # --------------------------------------------------------------------------
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Front-Controller: Normal Laravel Application Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM Execution Block
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        # For TCP socket deployment, uncomment:
        # fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI performance buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60s;

        # Prevent PHP engine signature leakage
        fastcgi_hide_header X-Powered-By;
    }

    # --------------------------------------------------------------------------
    # Block Sensitive Files and Hidden Dotfiles (.env, .git, .htaccess)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable logging for common static browser probes
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
