; BV Barber — Supervisor süreç tanımları (canlı sunucu)
; Kurulum:
;   sudo cp deploy/supervisor/bvberber.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
; Her deploy sonrası:
;   php artisan reverb:restart && php artisan queue:restart
;
; NOT: /var/www/bvberber/web ve www-data değerlerini sunucunuza göre düzenleyin.

[program:bvberber-reverb]
command=php /var/www/bvberber/web/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/bvberber/web
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/bvberber/web/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB

[program:bvberber-queue]
command=php /var/www/bvberber/web/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/bvberber/web
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/bvberber/web/storage/logs/queue.log
stdout_logfile_maxbytes=10MB

; Zamanlayıcı (appointments:check-pending vb.) — cron alternatifi.
; Cron kullanıyorsanız bu bloğu silin ve crontab'a şunu ekleyin:
;   * * * * * cd /var/www/bvberber/web && php artisan schedule:run >> /dev/null 2>&1
[program:bvberber-scheduler]
command=php /var/www/bvberber/web/artisan schedule:work
directory=/var/www/bvberber/web
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/bvberber/web/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
